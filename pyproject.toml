[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-crawler"
version = "0.6.0"
description = "Keel Crawler — a reusable, business-blind web-crawling toolkit: cheap-first HTTP fetch with a shared response cache, a browser/anti-bot escalation engine, proxy rotation, LLM-ready Markdown cleaning, and RSS source monitoring — extracted from the Revenika/Propopedia/Binarystyle crawlers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Milad Safaei" }]
license = { text = "UNLICENSED" }
dependencies = ["Django>=4.2", "requests>=2.28"]

# Heavy/optional capabilities are gated so a host that only needs the light HTTP
# tier carries none of them:
#   browser  — the crawl4ai + Playwright/Chromium engine (anti-bot escalation).
#   proxy    — nothing extra to import today (the Mihomo client is pure requests);
#              kept as a named extra so consumers can express intent and we can add
#              deps here later without a breaking change.
#   rss      — feedparser for the news-monitoring source layer.
[project.optional-dependencies]
browser = ["crawl4ai>=0.4", "playwright>=1.40", "lxml>=4.9"]
rss = ["feedparser>=6.0"]
markdown = ["beautifulsoup4>=4.11"]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-crawler"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_crawler"]
# hatchling includes every file under the package (templates/, migrations/,
# non-.py assets) automatically — no force-include (which would double-add them and
# fail the build with "a second file is being added at the same path").
